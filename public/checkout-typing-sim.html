<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Checkout (typing-sim mask) — Harbour Lane Coffee</title>
  <link rel="icon" href="/favicon.ico">
  <script src="/probe.js?v=13"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 28rem; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin-top: 0.75rem; font-size: 0.9rem; }
    input { width: 100%; box-sizing: border-box; padding: 0.4rem; margin-top: 0.2rem; }
    button { margin-top: 1.25rem; padding: 0.5rem 1rem; }
    .hint { color: #666; font-size: 0.8rem; margin-top: 0.25rem; }
    .arm { background: #f4f4f0; padding: 0.5rem 0.75rem; font-size: 0.85rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="arm">
    Arm: <strong>typing-sim mask</strong> —
    On paste for postcode/phone: preventDefault, then rebuild value
    character-by-character with synthetic keydown + input (phone-input
    library pattern). Same five shared names as
    <a href="/checkout.html">plain</a> /
    <a href="/checkout-controlled.html">controlled</a>.
  </div>
  <h1>Checkout</h1>
  <p>Ethiopia Guji — 250g — $18.00</p>
  <div id="root"></div>

  <script>
  (function () {
    var e = React.createElement;
    var useState = React.useState;
    var useRef = React.useRef;

    function digitsOnly(s) { return String(s || '').replace(/\D/g, ''); }

    function maskZip(raw) {
      return digitsOnly(raw).slice(0, 5);
    }

    function maskPhone(raw) {
      var d = digitsOnly(raw).slice(0, 10);
      if (d.length === 0) return '';
      if (d.length < 4) return '(' + d;
      if (d.length < 7) return '(' + d.slice(0, 3) + ') ' + d.slice(3);
      return '(' + d.slice(0, 3) + ') ' + d.slice(3, 6) + '-' + d.slice(6);
    }

    /*
     * Failure mode under test: some phone/ZIP libs swallow paste and
     * "type" each character so formatters run. That manufactures
     * keydowns from an agent paste — Layer D false negative risk.
     */
    function simulateTyping(el, text, applyMask, setValue, done) {
      var i = 0;
      var acc = '';
      function step() {
        if (i >= text.length) {
          if (done) done();
          return;
        }
        var ch = text.charAt(i++);
        try {
          el.dispatchEvent(new KeyboardEvent('keydown', {
            key: ch, code: 'Key' + ch.toUpperCase(), bubbles: true, cancelable: true
          }));
        } catch (err) {}
        acc += ch;
        var next = applyMask(acc);
        setValue(next);
        acc = digitsOnly(next) || next;
        try {
          el.dispatchEvent(new InputEvent('input', {
            data: ch, inputType: 'insertText', bubbles: true
          }));
        } catch (err) {
          try { el.dispatchEvent(new Event('input', { bubbles: true })); } catch (e2) {}
        }
        setTimeout(step, 0);
      }
      step();
    }

    function Field(props) {
      return e('label', { htmlFor: props.id },
        props.label,
        e('input', {
          id: props.id,
          name: props.id,
          ref: props.inputRef,
          value: props.value,
          onChange: props.onChange,
          onPaste: props.onPaste,
          onKeyDown: props.onKeyDown,
          autoComplete: props.autoComplete,
          inputMode: props.inputMode || undefined
        }),
        props.hint ? e('div', { className: 'hint' }, props.hint) : null
      );
    }

    function CheckoutForm() {
      var _a = useState(''), name = _a[0], setName = _a[1];
      var _b = useState(''), email = _b[0], setEmail = _b[1];
      var _c = useState(''), address = _c[0], setAddress = _c[1];
      var _d = useState(''), city = _d[0], setCity = _d[1];
      var _e = useState(''), postcode = _e[0], setPostcode = _e[1];
      var _f = useState(''), phone = _f[0], setPhone = _f[1];
      var zipRef = useRef(null);
      var phoneRef = useRef(null);

      function onZipKeyDown(ev) {
        if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
        var k = ev.key;
        if (k.length === 1 && !/[0-9]/.test(k)) ev.preventDefault();
      }

      function onPhoneKeyDown(ev) {
        if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
        var k = ev.key;
        if (k.length === 1 && !/[0-9]/.test(k)) ev.preventDefault();
      }

      function onZipPaste(ev) {
        ev.preventDefault();
        var clip = '';
        try {
          clip = (ev.clipboardData || window.clipboardData).getData('text') || '';
        } catch (err) {}
        var el = zipRef.current;
        if (!el) return;
        setPostcode('');
        simulateTyping(el, digitsOnly(clip).slice(0, 5), maskZip, setPostcode);
      }

      function onPhonePaste(ev) {
        ev.preventDefault();
        var clip = '';
        try {
          clip = (ev.clipboardData || window.clipboardData).getData('text') || '';
        } catch (err) {}
        var el = phoneRef.current;
        if (!el) return;
        setPhone('');
        simulateTyping(el, digitsOnly(clip).slice(0, 10), maskPhone, setPhone);
      }

      function submit(ev) {
        ev.preventDefault();
        alert('Order placed (probe — no payment).');
      }

      return e('form', { onSubmit: submit, autoComplete: 'on' },
        e(Field, {
          id: 'name', label: 'Full name', value: name,
          autoComplete: 'name',
          onChange: function (ev) { setName(ev.target.value); }
        }),
        e(Field, {
          id: 'email', label: 'Email', value: email,
          autoComplete: 'email',
          onChange: function (ev) { setEmail(ev.target.value); }
        }),
        e(Field, {
          id: 'address', label: 'Address', value: address,
          autoComplete: 'street-address',
          onChange: function (ev) { setAddress(ev.target.value); }
        }),
        e(Field, {
          id: 'city', label: 'City', value: city,
          autoComplete: 'address-level2',
          onChange: function (ev) { setCity(ev.target.value); }
        }),
        e(Field, {
          id: 'postcode', label: 'Postcode / ZIP', value: postcode,
          autoComplete: 'postal-code', inputMode: 'numeric',
          inputRef: zipRef,
          hint: 'Typing-sim: paste preventDefault → synthetic keydown per digit.',
          onKeyDown: onZipKeyDown,
          onPaste: onZipPaste,
          onChange: function (ev) { setPostcode(maskZip(ev.target.value)); }
        }),
        e(Field, {
          id: 'phone', label: 'Phone (typing-sim arm)', value: phone,
          autoComplete: 'tel', inputMode: 'tel',
          inputRef: phoneRef,
          hint: 'Typing-sim: paste → char-by-char keydowns + format. Extra field; Layer D uses five shared names.',
          onKeyDown: onPhoneKeyDown,
          onPaste: onPhonePaste,
          onChange: function (ev) { setPhone(maskPhone(ev.target.value)); }
        }),
        e('button', { type: 'submit' }, 'Place order')
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(e(CheckoutForm));
  })();
  </script>
</body>
</html>
